<form class="flex flex-column gap-2" [formGroup]="fgBudget">
  <app-budget-action-bar [budgets]="budgets"></app-budget-action-bar>
  <p-tabs value="0">
    <p-tablist>
        <p-tab value="0">Budget Summary</p-tab>
        <p-tab value="1">Breakdown</p-tab>
        <p-tab value="2">Debt to Income</p-tab>
    </p-tablist>
    <p-tabpanels>
      <p-tabpanel value="0">
        <app-budget-summary></app-budget-summary>
      </p-tabpanel>
      <p-tabpanel value="1" class="p-0">
        <div class="grid p-0">
          <div class="col-12 md:col-4">
            <div class="flex justify-content-between align-items-center mb-4">
              <h3 class="m-0">Need</h3>
              <div>
                <button pButton class="p-button-text" icon="pi pi-plus" pTooltip="Add Item"
                  (click)="needCategory.budgetItemPanel.show($event)"></button>
                <button pButton class="p-button-text p-button-info" icon="pi pi-save"
                  (click)="needCategory.save()"></button>
              </div>
            </div>
            <app-budget-categories #needCategory formArrayName="need"></app-budget-categories>
          </div>
          <div class="col-12 md:col-4">
            <div class="flex justify-content-between align-items-center mb-4">
              <h3 class="m-0">Want</h3>
              <div>
                <button pButton class="p-button-text" icon="pi pi-plus" pTooltip="Add Item"
                  (click)="wantCategory.budgetItemPanel.show($event)"></button>
                <button pButton class="p-button-text p-button-info" icon="pi pi-save"
                  (click)="wantCategory.save()"></button>
              </div>
            </div>
            <app-budget-categories #wantCategory formArrayName="want"></app-budget-categories>
          </div>
          <div class="col-12 md:col-4">
            <div class="flex justify-content-between align-items-center mb-4">
              <h3 class="m-0 col">Extra</h3>
              <div>
                <button pButton class="p-button-text" icon="pi pi-plus" pTooltip="Add Item"
                  (click)="extraCategory.budgetItemPanel.show($event)"></button>
                <button pButton class="p-button-text p-button-info" icon="pi pi-save"
                  (click)="extraCategory.save()"></button>
              </div>
            </div>
            <app-budget-categories #extraCategory formArrayName="extra"></app-budget-categories>
          </div>
        </div>
      </p-tabpanel>
      <p-tabpanel value="2">
        <app-budget-income-debt></app-budget-income-debt>
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
</form>
