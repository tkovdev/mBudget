<div class="grid">
  @for (payee of payees; track payee) {
    <div class="col-12 flex align-items-center justify-content-between p-0">
      <span>{{payee.name}}</span>
      <button pButton (click)="delete(payee)" icon="pi pi-trash" class="p-button-danger p-button-text ml-1"></button>
    </div>
  }
</div>
